worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # Local reverse proxy: PHP serve (Laravel) va WildFly (WS) tren 2 port rieng.
    # - Trang Laravel + REST  -> 127.0.0.1:8000
    # - WebSocket /ws/        -> 127.0.0.1:8080 (WildFly/JakartaEE)
    # Truy cap app qua http://127.0.0.1:8002 de realtime chat hoat dong.
    server {
        listen 8002;

        client_max_body_size 50M;

        location /ws/ {
            # Local IntelliJ deploy WAR ten JakartaEE-1.0-SNAPSHOT -> context path /JakartaEE-1.0-SNAPSHOT
            # Them context khi proxy sang WildFly. (In prod ROOT.war -> context '/', khong can rewrite.)
            rewrite ^/ws/(.*)$ /JakartaEE-1.0-SNAPSHOT/ws/$1 break;
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_buffering off;
        }

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}