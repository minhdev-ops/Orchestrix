version: '3.8'

services:
  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: agriverse-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/ssl:/etc/nginx/ssl
    depends_on:
      - php
      - redis
    networks:
      - agriverse

  # PHP-FPM
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agriverse-php
    restart: unless-stopped
    volumes:
      - .:/var/www
    depends_on:
      - mysql
      - redis
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - REDIS_HOST=redis
    networks:
      - agriverse

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: agriverse-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-agriverse}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-agriverse}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d
    networks:
      - agriverse

  # Redis
  redis:
    image: redis:alpine
    container_name: agriverse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - agriverse

  # Queue Worker
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agriverse-queue
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - .:/var/www
    depends_on:
      - php
      - redis
    networks:
      - agriverse

  # Scheduler
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agriverse-scheduler
    restart: unless-stopped
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
    volumes:
      - .:/var/www
    depends_on:
      - php
    networks:
      - agriverse

  # AI Inference Service (FastAPI + TensorFlow cho best_vit.keras, 71 classes)
  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: agriverse-ai-service
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      # Model file chia sẻ read-only, không copy vào image -> image nhỏ, đổi model không build lại
      - ./best_vit.keras:/models/best_vit.keras:ro
      # Override labels nếu muốn chỉnh sửa mà không build lại image
      - ./ai_service/labels.txt:/app/labels.txt:ro
    environment:
      - AI_MODEL_PATH=/models/best_vit.keras
      - AI_LABELS_PATH=/app/labels.txt
      - AI_INPUT_SIZE=224
      - AI_TOP_K=5
      - AI_DEVICE=auto
      - AI_STRIP_AUGMENTATION=false
      # Token bảo vệ endpoint (rỗng = bỏ qua kiểm tra; set để bật)
      - AI_AUTH_TOKEN=${AI_PLANT_DOCTOR_VIT_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    networks:
      - agriverse

  # Node.js (for frontend build)
  node:
    image: node:20-alpine
    container_name: agriverse-node
    working_dir: /var/www
    volumes:
      - .:/var/www
    command: sh -c "npm install && npm run build"
    networks:
      - agriverse

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  agriverse:
    driver: bridge
