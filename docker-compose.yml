services:
  nginx:
    image: nginx:alpine
    container_name: orchestrix-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/ssl:/etc/nginx/ssl
      - nginx_logs:/var/log/nginx
    depends_on:
      - php
      - wildfly
    networks:
      - agriverse

  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orchestrix-php
    restart: unless-stopped
    volumes:
      - .:/var/www
      - ./docker/php/conf.d/sys_temp.ini:/usr/local/etc/php/conf.d/sys_temp.ini
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-agriverse}
      - DB_USERNAME=${DB_USERNAME:-agriverse}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - APP_ENV=production
      - APP_DEBUG=false
    networks:
      - agriverse

  mysql:
    image: mysql:8.0
    container_name: orchestrix-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-agriverse}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MYSQL_USER: ${DB_USERNAME:-agriverse}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d
    networks:
      - agriverse
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: orchestrix-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - agriverse
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orchestrix-queue
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - .:/var/www
      - ./docker/php/conf.d/sys_temp.ini:/usr/local/etc/php/conf.d/sys_temp.ini
    depends_on:
      - php
      - redis
    networks:
      - agriverse

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orchestrix-scheduler
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
    volumes:
      - .:/var/www
      - ./docker/php/conf.d/sys_temp.ini:/usr/local/etc/php/conf.d/sys_temp.ini
    depends_on:
      - php
    networks:
      - agriverse

  # AI Inference Service (FastAPI + TensorFlow cho best_vit.keras, 71 classes)
  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: agriverse-ai-service
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      # Model file chia sẻ read-only, không copy vào image -> image nhỏ, đổi model không build lại
      - ./best_vit.keras:/models/best_vit.keras:ro
      # Override labels nếu muốn chỉnh sửa mà không build lại image
      - ./ai_service/labels.txt:/app/labels.txt:ro
    environment:
      - AI_MODEL_PATH=/models/best_vit.keras
      - AI_LABELS_PATH=/app/labels.txt
      - AI_INPUT_SIZE=224
      - AI_TOP_K=5
      - AI_DEVICE=auto
      - AI_STRIP_AUGMENTATION=false
      # Token bảo vệ endpoint (rỗng = bỏ qua kiểm tra; set để bật)
      - AI_AUTH_TOKEN=${AI_PLANT_DOCTOR_VIT_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    networks:
      - agriverse

  # Node.js (for frontend build)
  node:
    image: node:20-alpine
    container_name: agriverse-node
    working_dir: /var/www
    volumes:
      - .:/var/www
    command: sh -c "npm install && npm run build"
    networks:
      - agriverse

  wildfly:
    build:
      context: ${JAKARTA_PATH:-../03.JakartaEE/JakartaEE}
      dockerfile: deploy/wildfly/Dockerfile
    container_name: orchestrix-wildfly
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:mysql://mysql:3306/${DB_DATABASE:-agriverse}?useSSL=false&serverTimezone=UTC
      DATABASE_USER: ${DB_USERNAME:-agriverse}
      DATABASE_PASSWORD: ${DB_PASSWORD:-secret}
      JAVA_OPTS: -Xms512m -Xmx1024m -Djava.net.preferIPv4Stack=true
    ports:
      - "127.0.0.1:9990:9990"
    volumes:
      - wildfly_logs:/opt/wildfly/standalone/log
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agriverse

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local
  wildfly_logs:
    driver: local

networks:
  agriverse:
    driver: bridge
    name: agriverse
