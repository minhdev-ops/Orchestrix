version: '3.8'

services:
  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: agriverse-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/ssl:/etc/nginx/ssl
    depends_on:
      - php
      - redis
    networks:
      - agriverse

  # PHP-FPM
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agriverse-php
    restart: unless-stopped
    volumes:
      - .:/var/www
    depends_on:
      - mysql
      - redis
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - REDIS_HOST=redis
    networks:
      - agriverse

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: agriverse-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-agriverse}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-agriverse}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d
    networks:
      - agriverse

  # Redis
  redis:
    image: redis:alpine
    container_name: agriverse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - agriverse

  # Queue Worker
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agriverse-queue
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - .:/var/www
    depends_on:
      - php
      - redis
    networks:
      - agriverse

  # Scheduler
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agriverse-scheduler
    restart: unless-stopped
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
    volumes:
      - .:/var/www
    depends_on:
      - php
    networks:
      - agriverse

  # Node.js (for frontend build)
  node:
    image: node:20-alpine
    container_name: agriverse-node
    working_dir: /var/www
    volumes:
      - .:/var/www
    command: sh -c "npm install && npm run build"
    networks:
      - agriverse

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  agriverse:
    driver: bridge
